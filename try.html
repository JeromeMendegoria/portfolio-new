<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<style>
			.bounce-pop {
				display: inline-block;
				animation: popBounce 0.8s ease-out;
				font-size: 2.5rem;
				color: #333;
			}

			@keyframes popBounce {
				0% {
					opacity: 0;
					transform: scale(0.3) translateY(100%);
				}
				60% {
					opacity: 1;
					transform: scale(1.05) translateY(-10px);
				}
				80% {
					transform: scale(0.95) translateY(5px);
				}
				100% {
					transform: scale(1) translateY(0);
				}
			}
		</style>
		<title>Document</title>
	</head>
	<body>
		<h2 class="bounce-pop">Welcome!</h2>

		<script>
			const heading = document.querySelector(".bounce-pop");
			heading.classList.remove("bounce-pop"); // reset
			void heading.offsetWidth; // force reflow
			heading.classList.add("bounce-pop"); // re-add
		</script>
	</body>
</html>
