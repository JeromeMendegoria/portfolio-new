<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<style>
			.typing-container {
				font-family: monospace;
				font-size: 2rem;
				display: inline-block;
				white-space: nowrap;
			}

			.cursor {
				display: inline-block;
				animation: blink 0.7s steps(1) infinite;
			}

			@keyframes blink {
				50% {
					opacity: 0;
				}
			}
		</style>
		<title>Document</title>
	</head>
	<body>
		<div class="typing-container">
			<span id="typing-text"></span><span class="cursor">|</span>
		</div>
		
		
		<button onclick="enableTyping()">Start</button>
		<button onclick="disableTyping()">Stop</button>

		<script>
			const word = "Developer";
			let speed = 150; // typing speed in ms
			let isTyping = false;
			let typingInterval;
			let currentIndex = 0;
			const textElement = document.getElementById("typing-text");

			function typeLetterByLetter() {
				if (currentIndex < word.length) {
					textElement.textContent += word[currentIndex];
					currentIndex++;
				} else {
					clearInterval(typingInterval);
					isTyping = false;
				}
			}

			function enableTyping(customSpeed = 150) {
				if (isTyping) return;
				speed = customSpeed;
				textElement.textContent = "";
				currentIndex = 0;
				isTyping = true;
				typingInterval = setInterval(typeLetterByLetter, speed);
			}

			function disableTyping() {
				clearInterval(typingInterval);
				isTyping = false;
				textElement.textContent = ""; // Optional: remove text when stopped
				currentIndex = 0;
			}
		</script>
	</body>
</html>
